name: Install
description: Образ PHP и зависимости PHP и JS, с кэшем по lock-файлам.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          vendor
          node_modules
          e2e/node_modules
        key: deps-${{ runner.os }}-${{ hashFiles('composer.lock', 'package-lock.json', 'e2e/package-lock.json', 'docker/php/Dockerfile') }}
    - shell: bash
      run: |
        cp .env.example .env
        docker compose -p comments-test --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml build php
        make install
