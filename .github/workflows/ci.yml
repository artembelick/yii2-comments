# Запуски по таблице «Запуски» из docs/test-plans/README.md:
# - push в любую ветку: lint и unit с покрытием;
# - pull request и push в main: весь make check, разбитый на jobs (ярус parallel — шардами, pristine и exclusive — одним job),
#   затем job report сводит их результаты в отчёт (make report): в PR сайт — артефакт прогона, на push в main job pages
#   публикует его на GitHub Pages;
# - раз в сутки: весь make check дважды с разными seed случайного порядка и make test-rerun (повтор на том же стенде).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права токена для всех jobs; запись в Pages и OIDC получает только job pages.
permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: make lint

  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: make test-unit
      - uses: ./.github/actions/reports
        if: always()
        with:
          name: unit

  # Ярус parallel: каждый шард — отдельный job со своим стендом, и сначала smoke.
  parallel:
    needs: [lint, unit]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # Один TEST_RUN_ID на job: каждый шаг ниже — отдельный make и иначе сгенерировал бы свой.
      - name: TEST_RUN_ID
        run: |
          run_id=$(make -s run-id)
          echo "TEST_RUN_ID=$run_id"
          echo "TEST_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - run: make stand-up
      - run: make admin
      - run: make test-smoke
      - run: make test-regression-parallel
      - run: make test-regression-ws-parallel
      - run: make test-e2e-parallel
      # Логи php-fpm, ws и nginx: при 500 в них стек, которого нет в отчёте Playwright.
      - run: make stand-logs
        if: failure()
      - uses: ./.github/actions/reports
        if: always()
        with:
          name: parallel-${{ matrix.shard }}
      - run: make stand-down
        if: always()

  # pristine и exclusive: строго последовательно, одним job на пустой БД.
  serial:
    needs: [lint, unit]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # Один TEST_RUN_ID на job: каждый шаг ниже — отдельный make и иначе сгенерировал бы свой.
      - name: TEST_RUN_ID
        run: |
          run_id=$(make -s run-id)
          echo "TEST_RUN_ID=$run_id"
          echo "TEST_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - run: make stand-up
      - run: make admin
      - run: make test-smoke
      - run: make test-regression-pristine
      - run: make test-regression-exclusive
      - run: make test-regression-ws-exclusive
      - run: make test-e2e-exclusive
      # Логи php-fpm, ws и nginx: при 500 в них стек, которого нет в отчёте Playwright.
      - run: make stand-logs
        if: failure()
      - uses: ./.github/actions/reports
        if: always()
        with:
          name: serial
      - run: make stand-down
        if: always()

  # Отчёт: результаты Allure и покрытие из артефактов unit, parallel и serial сводятся в один отчёт и главную страницу.
  # Идёт и при упавших тестах (страница показывает, что упало), но не на отменённом прогоне: его отчёт неполный,
  # а на main он мог бы обогнать отчёт свежего прогона. Ссылки страницы — на файлы по SHA прогона: в PR это head-коммит
  # ветки, а не merge-коммит, которого после слияния нет, поэтому job берёт из git тот же коммит.
  report:
    needs: [unit, parallel, serial]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    env:
      REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REPORT_SHA }}
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: artifacts
      - run: make report-collect ARTIFACTS=artifacts
      - run: make report
        env:
          REPORT_REPO: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site/

  # Публикация на GitHub Pages только с main. Один раз вручную: Settings → Pages → Source: «GitHub Actions».
  # Отдельный job: права pages: write и id-token: write получает один шаг deploy без checkout и стороннего кода,
  # а environment github-pages (по умолчанию только main) не роняет report в PR.
  pages:
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Ночной прогон: два полных make check с разными seed ловят зависимость тестов друг от друга.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: make check
        run: |
          seed=$(( (RANDOM << 15 | RANDOM) + ${{ matrix.run }} ))
          echo "Seed: $seed"
          make check SEED="$seed"
      - uses: ./.github/actions/reports
        if: always()
        with:
          name: nightly-${{ matrix.run }}

  # Ночной повтор на том же стенде (ИЗ-1): второй проход без пересоздания стенда, с другим TEST_RUN_ID и seed.
  # Двойной make check выше ловит зависимость от порядка, этот job — зависимость от данных прошлого прогона.
  nightly-rerun:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: make test-rerun
      - uses: ./.github/actions/reports
        if: always()
        with:
          name: nightly-rerun
