suite_namespace: backend\tests\unit
actor: UnitTester
modules:
  enabled:
    - Asserts
    # Приложение админки на каждый тест, без БД: сервисы, репозитории и RateLimiter — моки через DI-контейнер.
    - Yii2:
        configFile: config/test.php
        part: [orm]
        transaction: false
        cleanup: false
    - common\tests\_support\ContainerReset
