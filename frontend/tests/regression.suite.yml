# REST-regression: HTTP-запросы к тестовому стенду без браузера. Ярусы — группы pristine, parallel, exclusive.
suite_namespace: frontend\tests\regression
actor: RegressionTester
modules:
  enabled:
    - Asserts
    - PhpBrowser:
        url: '%PUBLIC_URL%'
        # curl сам резолвит *.localhost в 127.0.0.1 и DNS не спрашивает. На стенде оба хоста — это nginx.
        curl:
          CURLOPT_CONNECT_TO: ['::nginx:']
    - REST:
        depends: PhpBrowser
        url: '%PUBLIC_URL%'
    # Фикстуры и доступ к Redis стенда (сброс лимита): данные пишутся без транзакции и без очистки
    # (README, «Работа с данными»).
    - Yii2:
        configFile: ../common/config/test.php
        applicationClass: yii\console\Application
        part: [orm, fixtures]
        transaction: false
        cleanup: false
    - common\tests\_support\FixturesModule
