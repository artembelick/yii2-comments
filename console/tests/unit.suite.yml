suite_namespace: console\tests\unit
actor: UnitTester
modules:
  enabled:
    - Asserts
    # Приложение Yii на каждый тест: сервисы берут из него компонент security. В БД тесты консоли не ходят.
    - Yii2:
        configFile: ../common/config/test.php
        applicationClass: yii\console\Application
        part: [orm]
        transaction: false
        cleanup: false
    - common\tests\_support\ContainerReset
