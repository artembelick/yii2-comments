; Xdebug выключен по умолчанию. Переменная окружения XDEBUG_MODE=debug перекрывает эту настройку.
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger

; pcov собирает покрытие только по коду приложений, без vendor.
pcov.enabled = 1
pcov.directory = /app
pcov.exclude = "~/(vendor|tests|node_modules)/~"
