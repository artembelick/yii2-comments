; Xdebug выключен по умолчанию. Переменная окружения XDEBUG_MODE=debug перекрывает эту настройку.
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger

; pcov выключен для php-fpm и включается только на прогоне unit-тестов (make test-unit: php -d pcov.enabled=1).
; Собирает покрытие только по коду приложений, без vendor.
pcov.enabled = 0
pcov.directory = /app
pcov.exclude = "~/(vendor|tests|node_modules)/~"
