# Корневой конфиг собирает тесты всех приложений и считает общее покрытие (docs/test-plans/README.md).
include:
  - common
  - frontend
  - backend
  - console
  - ws
paths:
  output: tests/_output
settings:
  colors: true
  memory_limit: 1024M
  # ИЗ-1: случайный порядок, seed печатается в начале прогона. Повтор: --seed <число>.
  shuffle: true
  # ПР-5: тест без проверок отмечается как useless; tools/checks junit роняет на нём прогон.
  report_useless_tests: true
  disallow_test_output: true
  be_strict_about_changes_to_global_state: true
  # Deprecation и warning PHP становятся ошибками теста.
  convert_deprecations_to_exceptions: true
  error_level: E_ALL
# Allure-результаты всех приложений — в один каталог: make report сводит их с Vitest и Playwright.
extensions:
  enabled:
    - Qameta\Allure\Codeception\AllureCodeception
  config:
    Qameta\Allure\Codeception\AllureCodeception:
      # Путь считается от output каждого приложения (common/tests/_output и т. д.), ведущий / адаптер срезает.
      # Три уровня вверх — корень проекта, все приложения пишут в общий tests/_output/allure-results.
      outputDirectory: ../../../tests/_output/allure-results
